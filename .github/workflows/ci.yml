name: operator-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
      - name: Check module state
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify module checksums
        run: GOWORK=off go mod verify
      - name: Generate API and manifests
        run: |
          make generate manifests
          git diff --exit-code
      - name: Test
        run: GOWORK=off go test ./...
      - name: Race test
        run: GOWORK=off go test -race ./...
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Govulncheck
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Prepare PR lint patch
        id: pr-lint-patch
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$LINT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${LINT_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$LINT_BASE_SHA" HEAD
          patch_path="${RUNNER_TEMP}/soha-operator-pr-lint.patch"
          git diff --no-ext-diff --no-textconv --no-color --binary "$LINT_BASE_SHA" HEAD > "$patch_path"
          test -s "$patch_path"
          printf 'args=--new-from-patch="%s"\n' "$patch_path" >> "$GITHUB_OUTPUT"
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: 'off'
        with:
          version: v2.14.0
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: --timeout=5m ${{ steps.pr-lint-patch.outputs.args }}
      - name: Build
        run: GOWORK=off CGO_ENABLED=0 go build -trimpath -o /tmp/soha-operator ./cmd/operator
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.1
      - name: Validate Kubernetes manifests
        run: kubectl kustomize config/default | go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -kubernetes-version 1.35.1 -strict -skip CustomResourceDefinition -summary -
      - name: Build image
        run: docker build -f deploy/Dockerfile -t ghcr.io/opensoha/soha-operator:test .
