apiVersion: apps/v1
kind: Deployment
metadata:
  name: soha-operator-controller-manager
  namespace: soha-operator-system
  labels:
    app.kubernetes.io/name: soha-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soha-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soha-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: soha-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/opensoha/soha-operator:0.1.1
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
